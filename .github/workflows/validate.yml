name: Static and offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck wireguard-tools
      - name: Shell, unit, lifecycle and offline dry-run checks
        run: ./tests/run.sh
